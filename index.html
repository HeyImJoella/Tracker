<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <!-- Google Fonts: Newsreader (heading serif) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Design tokens -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <!-- Figma capture helper: reads figmaview / figmamobile from URL hash -->
  <script>
    window.addEventListener('load', () => {
      const hash = location.hash || '';
      if (!hash.includes('figmacapture')) return;
      const params = Object.fromEntries(
        hash.slice(1).split('&').map(p => { const [k,v] = p.split('='); return [k, decodeURIComponent(v||'')]; })
      );
      if (params.figmaview) {
        const btn = document.querySelector(`[data-view="${params.figmaview}"]`);
        if (btn) btn.click();
      }
      if (params.figmamobile === '1') {
        document.documentElement.style.setProperty('--sidebar-w', '0px');
        const app = document.querySelector('.app');
        if (app) app.style.maxWidth = '390px';
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) sidebar.style.display = 'none';
        const topbar = document.querySelector('.topbar');
        if (topbar) topbar.style.display = 'flex';
      }
    });
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
</head>
<body>
  <div class="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M8.31885 12.1982L12.1989 8.31823M15.3029 11.4222L11.4229 15.3023"/><path d="M7.14342 19.3312L8.3807 20.5684C9.28489 21.4726 9.73699 21.9247 10.2891 21.9892C10.4123 22.0036 10.5368 22.0036 10.6601 21.9892C11.2121 21.9247 11.6642 21.4726 12.5684 20.5684C13.4726 19.6642 13.9247 19.2121 13.9892 18.6601C14.0036 18.5368 14.0036 18.4123 13.9892 18.2891C13.9247 17.737 13.4726 17.2849 12.5684 16.3807L7.6193 11.4316C6.71511 10.5274 6.26301 10.0753 5.71092 10.0108C5.58768 9.9964 5.46318 9.9964 5.33994 10.0108C4.78785 10.0753 4.33575 10.5274 3.43156 11.4316C2.52737 12.3358 2.07528 12.7879 2.0108 13.3399C1.9964 13.4632 1.9964 13.5877 2.0108 13.7109C2.07528 14.263 2.52737 14.7151 3.43157 15.6193L4.05021 16.2379"/><path d="M16.8566 4.66885L15.6193 3.43156C14.7151 2.52737 14.263 2.07528 13.7109 2.0108C13.5877 1.9964 13.4632 1.9964 13.3399 2.0108C12.7879 2.07528 12.3358 2.52737 11.4316 3.43156C10.5274 4.33575 10.0753 4.78785 10.0108 5.33994C9.9964 5.46318 9.9964 5.58768 10.0108 5.71092C10.0753 6.26301 10.5274 6.71511 11.4316 7.6193L16.3807 12.5684C17.2849 13.4726 17.737 13.9247 18.2891 13.9892C18.4123 14.0036 18.5368 14.0036 18.6601 13.9892C19.2121 13.9247 19.6642 13.4726 20.5684 12.5684C21.4726 11.6642 21.9247 11.2121 21.9892 10.6601C22.0036 10.5368 22.0036 10.4123 21.9892 10.2891C21.9247 9.73699 21.4726 9.28489 20.5684 8.3807L19.9498 7.76206"/><path d="M18.0188 2.49805L21.1228 5.60206"/><path d="M2.49756 18.0186L5.60157 21.1226"/></svg>
          </div>
          <span class="logo-name">Tracker</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-label">TRAINING</span>
          <button class="nav-item active" data-view="workouts" onclick="switchView(this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 12h12M3 6l3 6-3 6M21 6l-3 6 3 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-text">Workouts</span>
          </button>
          <button class="nav-item" data-view="progression" onclick="switchView(this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-text">Progression</span>
          </button>
        </div>
      </nav>

    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ===== MAIN ===== -->
    <main class="main" id="main">

      <!-- Mobile topbar -->
      <div class="topbar">
        <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="topbar-title">Tracker</span>
        <div class="topbar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M8.31885 12.1982L12.1989 8.31823M15.3029 11.4222L11.4229 15.3023"/><path d="M7.14342 19.3312L8.3807 20.5684C9.28489 21.4726 9.73699 21.9247 10.2891 21.9892C10.4123 22.0036 10.5368 22.0036 10.6601 21.9892C11.2121 21.9247 11.6642 21.4726 12.5684 20.5684C13.4726 19.6642 13.9247 19.2121 13.9892 18.6601C14.0036 18.5368 14.0036 18.4123 13.9892 18.2891C13.9247 17.737 13.4726 17.2849 12.5684 16.3807L7.6193 11.4316C6.71511 10.5274 6.26301 10.0753 5.71092 10.0108C5.58768 9.9964 5.46318 9.9964 5.33994 10.0108C4.78785 10.0753 4.33575 10.5274 3.43156 11.4316C2.52737 12.3358 2.07528 12.7879 2.0108 13.3399C1.9964 13.4632 1.9964 13.5877 2.0108 13.7109C2.07528 14.263 2.52737 14.7151 3.43157 15.6193L4.05021 16.2379"/><path d="M16.8566 4.66885L15.6193 3.43156C14.7151 2.52737 14.263 2.07528 13.7109 2.0108C13.5877 1.9964 13.4632 1.9964 13.3399 2.0108C12.7879 2.07528 12.3358 2.52737 11.4316 3.43156C10.5274 4.33575 10.0753 4.78785 10.0108 5.33994C9.9964 5.46318 9.9964 5.58768 10.0108 5.71092C10.0753 6.26301 10.5274 6.71511 11.4316 7.6193L16.3807 12.5684C17.2849 13.4726 17.737 13.9247 18.2891 13.9892C18.4123 14.0036 18.5368 14.0036 18.6601 13.9892C19.2121 13.9247 19.6642 13.4726 20.5684 12.5684C21.4726 11.6642 21.9247 11.2121 21.9892 10.6601C22.0036 10.5368 22.0036 10.4123 21.9892 10.2891C21.9247 9.73699 21.4726 9.28489 20.5684 8.3807L19.9498 7.76206"/><path d="M18.0188 2.49805L21.1228 5.60206"/><path d="M2.49756 18.0186L5.60157 21.1226"/></svg>
        </div>
      </div>

      <!-- ==============================
           WORKOUTS VIEW
      ============================== -->
      <div id="view-workouts" class="view active">
        <div class="page-header">
          <div>
            <span class="page-tag">● Training</span>
            <h1 class="page-title">Workouts</h1>
          </div>
        </div>

        <div class="tab-row" id="tab-row"></div>
        <div id="workout-delete-row">
          <button class="ghost-danger-btn" onclick="deleteCurrentWorkout()">🗑️ Delete workout</button>
        </div>

        <div class="card workout-card">
          <div id="timer-bar"></div>
          <div id="workout-content"></div>
          <button class="save-btn" id="save-btn" onclick="logWorkout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save Session
          </button>
        </div>
      </div>

      <!-- ==============================
           PROGRESSION VIEW
      ============================== -->
      <div id="view-progression" class="view">
        <div class="page-header">
          <div>
            <span class="page-tag">● Progress</span>
            <h1 class="page-title">Progression</h1>
          </div>
        </div>

        <!-- Two-column layout -->
        <div class="prog-layout">

          <!-- Left: chart -->
          <div class="card chart-card prog-chart-col">
            <div class="card-head">
              <h3>Weight Progression</h3>
              <select id="chart-exercise" onchange="renderChart()" class="filter-select"></select>
            </div>
            <div id="chart-wrap">
              <svg id="prog-chart" width="100%" height="100%"></svg>
              <div id="chart-empty" class="chart-empty" style="display:none">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <p>Log a workout to see your progression</p>
              </div>
            </div>
          </div>

          <!-- Right: history panel -->
          <div class="card prog-history-col">
            <div class="card-head history-head">
              <h3>Session History</h3>
              <div class="history-filters">
                <select id="filter-exercise" onchange="renderHistory()" class="filter-select">
                  <option value="all">All Exercises</option>
                </select>


              </div>
            </div>
            <div id="history-content"></div>
            <div class="danger-row">
              <button class="ghost-danger-btn" onclick="setupClearAll()">🗑️ Clear all history</button>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- ===== DELETE MODAL ===== -->
  <div id="deleteModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 id="modal-title">Delete log?</h3>
      <p id="modal-text">Are you sure? This cannot be undone.</p>
      <div class="modal-actions">
        <button onclick="closeDeleteModal()" class="modal-cancel">Cancel</button>
        <button onclick="confirmDeletion()" class="modal-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
